name: r-blas CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  format_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  build_and_test:
    runs-on: ubuntu-latest
    needs: format_check
    strategy:
      matrix:
        toolchain: ["1.85.1", "1.99.1"]
        profile: ["debug", "release"]
        include:
          - profile: release
            release_flag: "--release"
          - profile: debug
            release_flag: ""
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Build
        run: cargo build ${{ matrix.release_flag }}

      - name: Lint
        run: cargo clippy --no-deps --all-targets --all-features ${{ matrix.release_flag }} -- -D warnings

      - name: Unit Tests
        run: cargo test ${{ matrix.release_flag }}

      - name: Conjugate gradient
        run: cargo run -p cg ${{ matrix.release_flag }}

      - name: Check 100% coverage
        run: cargo llvm-cov -p complex -p blas1 ${{ matrix.release_flag }} --summary-only --fail-under-lines 100 --fail-under-regions 100 --fail-under-functions 100

      - name: Docs
        run: cargo doc --no-deps ${{ matrix.release_flag }}
